services:
  - type: web
    name: goodbean-java-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: FRONTEND_ORIGINS
        value: https://*.vercel.app,http://localhost:5500,http://127.0.0.1:5500,http://localhost:5173,http://localhost:3000
